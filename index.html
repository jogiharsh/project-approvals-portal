<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Approvals - NSW Tracker</title>
  
  <!-- html2pdf library for perfectly scaled PDF Invoices -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <!-- Load your private config file (MUST be in the same folder) -->
  <script src="config.js"></script>

  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
      --primary: #4f46e5; --primary-hover: #4338ca; --primary-soft: #e0e7ff;
      --danger: #dc2626; --danger-soft: #fef2f2; --success: #16a34a;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    button, input, select, textarea { font: inherit; }

    /* Layout */
    .app-wrapper { display: flex; flex-direction: column; min-height: 100vh; display: none; }
    .top-nav { background: #ffffff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .nav-container { max-width: 1400px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 32px; height: 32px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 800; border-radius: 4px; font-size: 14px; }
    .brand h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .main-menu { display: flex; gap: 4px; align-items: center; }

    .nav-btn { background: transparent; border: none; color: var(--muted); padding: 8px 12px; border-radius: var(--radius); cursor: pointer; font-weight: 500; font-size: 14px; transition: all 0.2s; }
    .nav-btn:hover { color: var(--text); background: var(--bg); }
    .nav-btn.active { background: var(--primary-soft); color: var(--primary); }

    .sync-wrapper { display: flex; align-items: center; gap: 8px; margin-left: 16px; padding-left: 16px; border-left: 1px solid var(--border); }
    .sync-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; cursor: help; }
    .sync-dot.green { background: #16a34a; box-shadow: 0 0 6px rgba(22, 163, 74, 0.4); }
    .sync-dot.red { background: #dc2626; box-shadow: 0 0 6px rgba(220, 38, 38, 0.4); }
    .sync-dot.yellow { background: #d97706; box-shadow: 0 0 6px rgba(217, 119, 6, 0.4); }

    main.content-container { max-width: 1400px; margin: 0 auto; padding: 32px 24px; width: 100%; flex: 1; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
    .topbar h2 { margin: 0; font-size: 24px; font-weight: 600; }
    .topbar p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Buttons */
    .btn { background: #fff; border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: var(--bg); border-color: #cbd5e1; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn.danger { background: #fff; border-color: var(--danger); color: var(--danger); }
    .btn.danger:hover { background: var(--danger-soft); }
    .btn.small { padding: 4px 10px; font-size: 12px; }
    .btn.outline-primary { color: var(--primary); border-color: var(--primary-soft); }
    .btn.outline-primary:hover { background: var(--primary-soft); }

    /* Grids & Cards */
    .grid { display: grid; gap: 20px; }
    .grid.stats { grid-template-columns: repeat(4, 1fr); margin-bottom: 24px; }
    .grid.two { grid-template-columns: repeat(2, 1fr); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; }
    .stat-card span { color: var(--muted); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card strong { font-size: 32px; font-weight: 300; margin-top: 8px; color: var(--text); }

    /* Dashboard Layouts */
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; background: var(--card); padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); }
    .toolbar-filters { display: flex; gap: 12px; flex: 1; }
    .view-toggle { display: flex; background: var(--bg); border-radius: var(--radius); padding: 4px; border: 1px solid var(--border); }
    .view-toggle button { background: transparent; border: none; padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; color: var(--muted); font-weight: 500; }
    .view-toggle button.active { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    
    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .pipeline-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: start; }
    .pipeline-col { background: #f1f5f9; border-radius: var(--radius); padding: 16px; min-height: 400px; }
    .pipeline-col h3 { margin: 0 0 16px; font-size: 14px; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .pipeline-col h3 span { background: #e2e8f0; padding: 2px 8px; border-radius: 99px; font-size: 12px; }
    .pipeline-cards { display: flex; flex-direction: column; gap: 12px; }
    
    .project-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; transition: box-shadow 0.2s, transform 0.2s; display: flex; flex-direction: column; gap: 12px; }
    .project-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: #cbd5e1; }
    .project-card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .project-card h4 { margin: 0; font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .project-card p { margin: 0; font-size: 13px; color: var(--muted); }
    .project-card-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

    /* Forms */
    .field { display: flex; flex-direction: column; position: relative; }
    .field label { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; text-transform: uppercase; }
    input, select, textarea { width: 100%; border: 1px solid var(--border); background: #fff; padding: 8px 12px; border-radius: var(--radius); font-size: 14px; outline: none; transition: border-color 0.2s; }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

    .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 60; display: none; max-height: 200px; overflow-y: auto; margin-top: 4px; }
    .suggestions.show { display: block; }
    .suggestion { width: 100%; text-align: left; padding: 10px 12px; background: none; border: none; border-bottom: 1px solid var(--bg); cursor: pointer; font-size: 14px; }
    .suggestion:hover { background: var(--bg); }
    .address-status { font-size: 11px; color: var(--muted); margin-top: 4px; min-height: 16px; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    th { background: #fdfdfd; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; }
    tr:hover td { background: var(--bg); }

    /* Pills */
    .pill { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-active { background: #e0e7ff; color: #4338ca; }
    .status-hold { background: #fffbeb; color: #d97706; }
    .status-completed { background: #f0fdf4; color: #16a34a; }
    .hidden { display: none !important; }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin: 24px 0; overflow-x: auto; }
    .tab-btn { background: transparent; border: none; padding: 12px 24px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .section-title h3 { margin: 0; font-size: 18px; font-weight: 600; }
    .empty { text-align: center; padding: 60px 20px; background: var(--bg); border-radius: var(--radius); color: var(--muted); border: 1px dashed var(--border); }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
    .modal-backdrop.show { display: flex; }
    .modal { background: var(--card); width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; border-radius: var(--radius); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); padding: 32px; }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
    .modal-header h3 { margin: 0; font-size: 20px; font-weight: 600; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .full { grid-column: 1 / -1; }

    /* Auth Screen */
    .auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .auth-card { background: #fff; padding: 40px; width: 100%; max-width: 400px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; }
    .auth-card .brand-mark { margin: 0 auto 20px; width: 48px; height: 48px; font-size: 20px; border-radius: 8px; }
    .auth-card h2 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
    .auth-error { display: none; margin-top: 16px; color: var(--danger); background: var(--danger-soft); padding: 12px; border-radius: var(--radius); font-size: 13px; }
    .auth-error.show { display: block; }

    /* Invoice Specific */
    .invoice-shell { display: grid; gap: 24px; }
    .invoice-preview { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 40px; box-shadow: var(--shadow); }
    .invoice-header { display: flex; justify-content: space-between; margin-bottom: 40px; }
    .invoice-meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .invoice-meta-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
    .invoice-table-rendered { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
    .invoice-table-rendered th, .invoice-table-rendered td { padding: 12px; border: 1px solid var(--border); }
    .invoice-table-rendered td:last-child, .invoice-table-rendered th:last-child { text-align: right; width: 140px; }
    .invoice-footer { display: flex; justify-content: space-between; align-items: flex-end; }
    .invoice-notes { font-size: 14px; white-space: pre-wrap; color: var(--muted); }
    .invoice-summary { width: 300px; }
    .summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
    .summary-row.grand { font-size: 18px; font-weight: 700; border-top: 2px solid var(--border); margin-top: 8px; padding-top: 12px; }

    /* Checklist Editable Library */
    .checklist-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .checklist-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; }

    .file-list { display: grid; gap: 12px; }
    .file-item { background: var(--bg); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

    @media print {
      body { background: #fff; color: #000; }
      .top-nav, .tabs, .no-print, .modal-backdrop, #dashboardView, #projectView, .actions { display: none !important; }
      .app-wrapper { display: block; }
      main.content-container { padding: 0; max-width: none; }
      .print-report { display: block; }
      .invoice-preview { box-shadow: none; border: none; padding: 0; }
    }
  </style>
</head>
<body class="locked">

  <div id="authScreen" class="auth-screen">
    <form class="auth-card" onsubmit="unlockPortal(event)">
      <div class="brand-mark">PA</div>
      <h2>Internal Portal</h2>
      <p>Enter your password to access the approval tracker.</p>
      <div class="field">
        <input id="portalPassword" type="password" autocomplete="current-password" placeholder="Password" required />
      </div>
      <button class="btn primary" type="submit" style="width:100%; margin-top:16px;">Access Portal</button>
      <div id="authError" class="auth-error">Incorrect password. Please try again.</div>
    </form>
  </div>

  <div class="app-wrapper">
    <header class="top-nav no-print">
      <div class="nav-container">
        <div class="brand">
          <div class="brand-mark">PA</div>
          <div><h1>Project Approvals</h1></div>
        </div>
        <nav class="main-menu">
          <button class="nav-btn active" onclick="showDashboard()">Dashboard</button>
          <button class="nav-btn" onclick="openProjectModal()">Add Project</button>
          <button class="nav-btn" onclick="showChecklistLibrary()">Library</button>
          <button class="nav-btn" onclick="exportData()">Backup</button>
          <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)" />
          <button class="nav-btn" onclick="document.getElementById('importFile').click()">Restore</button>
          
          <div class="sync-wrapper">
            <div id="syncDot" class="sync-dot yellow" title="Waiting for setup"></div>
          </div>
        </nav>
      </div>
    </header>

    <main class="content-container">
      <!-- DASHBOARD VIEW -->
      <section id="dashboardView">
        <div class="topbar no-print">
          <div>
            <h2 id="pageTitle">Dashboard</h2>
            <p id="pageSubtitle">Track DA, CDC, CC, OC, BASIX and BIC jobs.</p>
          </div>
          <div class="actions">
            <button class="btn" onclick="exportToCSV()">⤓ Export CSV</button>
            <button class="btn primary" onclick="openProjectModal()">+ New Project</button>
          </div>
        </div>

        <div class="grid stats">
          <div class="stat-card"><span>Total Projects</span><strong id="statTotal">0</strong></div>
          <div class="stat-card"><span>Active</span><strong id="statActive">0</strong></div>
          <div class="stat-card"><span>Missing Documents</span><strong id="statMissing">0</strong></div>
          <div class="stat-card"><span>Total Billed</span><strong id="statRevenue">$0</strong></div>
        </div>

        <div class="toolbar">
          <div class="toolbar-filters">
            <input id="searchInput" placeholder="Search address, client..." oninput="renderDashboard()" style="width:250px;" />
            <select id="typeFilter" onchange="renderDashboard()" style="width:180px;">
              <option value="">All Types</option><option>DA</option><option>CDC</option><option>CC</option><option>OC</option><option>BASIX</option><option>BIC</option><option>Other</option>
            </select>
          </div>
          <div class="view-toggle">
            <button id="btnViewGrid" class="active" onclick="setDashboardView('grid')">Grid</button>
            <button id="btnViewBoard" onclick="setDashboardView('board')">Pipeline</button>
          </div>
        </div>
        
        <div id="projectTableWrap"></div>
      </section>

      <!-- PROJECT FILE VIEW -->
      <section id="projectView" class="hidden">
        <div class="card no-print" style="margin-bottom: 0; padding-bottom: 0; border-bottom: none; border-radius: var(--radius) var(--radius) 0 0;">
          <div class="section-title">
            <div>
              <h3 id="projectHeading">Project File</h3>
              <p id="projectMeta"></p>
            </div>
            <div class="actions">
              <button class="btn" onclick="showDashboard()">Back</button>
              <button class="btn outline-primary" onclick="generateEmailChase()">✉ Chase Missing Docs</button>
              <button class="btn" onclick="openProjectModal(currentProjectId)">Edit Details</button>
              <button class="btn danger" onclick="deleteCurrentProject()">Delete</button>
            </div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="tabs no-print" style="background: var(--card); padding: 0 24px; margin-top: 0; border-radius: 0 0 var(--radius) var(--radius); border-left: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 24px;">
          <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
          <button class="tab-btn" data-tab="documents" onclick="switchTab('documents')">Documents</button>
          <button class="tab-btn" data-tab="councilNotes" onclick="switchTab('councilNotes')">Council Notes</button>
          <button class="tab-btn" data-tab="invoice" onclick="switchTab('invoice')">Invoice</button>
          <button class="tab-btn" data-tab="files" onclick="switchTab('files')">Files</button>
          <button class="tab-btn" data-tab="projectNotes" onclick="switchTab('projectNotes')">Internal Notes</button>
        </div>

        <div id="projectTabContent"></div>
      </section>

      <!-- CHECKLIST LIBRARY VIEW -->
      <section id="libraryView" class="hidden"></section>
      
      <section id="printReport" class="print-report"></section>
    </main>
  </div>

  <!-- PROJECT MODAL -->
  <div id="projectModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <div><h3 id="modalTitle">Add Project</h3></div>
        <button class="btn small" onclick="closeProjectModal()">✕ Close</button>
      </div>
      <form id="projectForm" onsubmit="saveProject(event)">
        <input type="hidden" id="projectId" />
        <div class="form-grid">
          <div class="field"><label>Client name</label><input id="clientName" required placeholder="John Smith" /></div>
          <div class="field"><label>Client phone</label><input id="clientPhone" placeholder="0400 000 000" /></div>
          <div class="field"><label>Client email</label><input id="clientEmail" type="email" placeholder="client@email.com" /></div>
          <div class="field"><label>Council</label><select id="council" required></select></div>
          <div class="field full">
            <label>Site address</label>
            <input id="siteAddress" required autocomplete="off" placeholder="Start typing the street..." oninput="showAddressSuggestions(this.value)" onfocus="showAddressSuggestions(this.value)" />
            <div id="addressSuggestions" class="suggestions"></div>
            <div id="addressLookupStatus" class="address-status"></div>
          </div>
          <div class="field"><label>Lot / DP</label><input id="lotDp" placeholder="Lot 1 DP 123456" /></div>
          <div class="field"><label>Project type</label><input id="projectType" placeholder="Alteration/addition..." /></div>
          <div class="field"><label>Approval type</label><select id="approvalType" required><option>DA</option><option>CDC</option><option>CC</option><option>OC</option><option>BASIX</option><option>BIC</option><option>Other</option></select></div>
          <div class="field"><label>Project Status</label><select id="jobStatus"><option value="Active">Active</option><option value="Hold">Hold</option><option value="Completed">Completed</option></select></div>
        </div>
        <div class="actions" style="justify-content:flex-end; margin-top:24px;">
          <button type="button" class="btn" onclick="closeProjectModal()">Cancel</button>
          <button class="btn primary" type="submit">Save Project</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ==========================================
    // SUPABASE COMMUNICATION (RESTORED EXACTLY FROM INDEX_2.HTML)
    // ==========================================
    const SUPABASE_TABLE = 'app_state'; 
    const APP_STATE_ID = 'main';
    const LOCAL_FALLBACK_KEY = 'projectApprovalsTracker.v10.localFallback';
    const LIBRARY_FALLBACK_KEY = 'projectApprovalsTracker.v10.library';
    
    const BUSINESS_PROFILE = { name: 'Project Approvals', abn: 'ABN 16 696 716 980', email: 'info@projectapprovals.com.au', phone: '0414633507', address: 'Quakershill NSW 2763', bankDetails: 'PayID: info@projectapprovals.com.au\nBank: NAB\nAccount Name: Project Approvals\nBSB: 082-356\nAccount No: 308014097' };
    const INVOICE_SERVICE_OPTIONS = ['CDC consulting service','DA application support','CC approval support','OC approval support','BASIX coordination','Council lodgement support','Site inspection consulting','General approval consulting'];

    let projects = [];
    let currentProjectId = null;
    let activeTab = 'overview';
    let isCloudReady = false;
    let currentView = 'grid';

    // INDEXEDDB SETUP FOR LOCAL IMAGE CACHING
    let localDB;
    const request = indexedDB.open("PA_FilesDatabase", 1);
    request.onupgradeneeded = (e) => { localDB = e.target.result; localDB.createObjectStore("files", { keyPath: "id" }); };
    request.onsuccess = (e) => { localDB = e.target.result; };

    let checklistLibrary = {
      DA: ['Owner consent','Site survey','Architectural drawings','Statement of Environmental Effects','Cost estimate report'],
      CDC: ['Design plans','Certificate of title','Building specifications','Structural plans','BASIX certificate'],
      CC: ['Development consent','Construction drawings','Structural engineering plans','NCC/BCA compliance notes'],
      OC: ['Final inspection record','Fire safety certificate','Compliance certificates','Waterproofing certificate'],
      BASIX: ['Project details','Floor area','Window details','Insulation details','Hot water system'],
      BIC: ['BIC application form','Site survey','Photos of existing works','Structural certificate'],
      Other: ['Client instructions','Site photos','Consultant advice']
    };

    function unlockPortal(event) {
      event.preventDefault();
      if (document.getElementById('portalPassword').value === PORTAL_PASSWORD) {
        sessionStorage.setItem('paPortalUnlocked', 'yes');
        document.body.classList.remove('locked');
        document.getElementById('authScreen').style.display = 'none';
        document.querySelector('.app-wrapper').style.display = 'flex';
      } else {
        document.getElementById('authError').classList.add('show');
      }
    }

    function checkPortalAuth() {
      if (sessionStorage.getItem('paPortalUnlocked') === 'yes') {
        document.body.classList.remove('locked');
        document.getElementById('authScreen').style.display = 'none';
        document.querySelector('.app-wrapper').style.display = 'flex';
      }
    }

    function setSyncStatus(message, tone='warning') {
      const dot = document.getElementById('syncDot');
      if (dot) { dot.className = `sync-dot ${tone === 'warning' ? 'yellow' : tone === 'error' ? 'red' : 'green'}`; dot.title = message; }
    }

    function uid() { return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2); }
    function todayISO() { return new Date().toISOString().slice(0,10); }
    function esc(value='') { return String(value).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
    function formatCurrency(amount) { return new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD', maximumFractionDigits:2 }).format(Number(amount || 0)); }
    function looksCustomService(name='') { return !!name && !INVOICE_SERVICE_OPTIONS.includes(name); }
    function addDays(dateString, days) { const d = dateString ? new Date(dateString) : new Date(); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); }

    function getNextGlobalInvoiceNumber() {
      let maxNumber = 999;
      projects.forEach(p => { if (p.invoice?.invoiceNumber) { const match = p.invoice.invoiceNumber.match(/\d+$/); if (match) { const num = parseInt(match[0], 10); if (num > maxNumber) maxNumber = num; } } });
      return `INV-${maxNumber + 1}`;
    }

    function defaultInvoice(project) { return { invoiceNumber: getNextGlobalInvoiceNumber(), issueDate: todayISO(), dueDate: addDays(todayISO(), 7), lineItems: [{ id: uid(), serviceName: `${project?.approvalType || 'Approval'} consulting service`, price: '' }], notes: BUSINESS_PROFILE.bankDetails }; }

    function loadLocalFallback() { 
      try { 
        const lib = localStorage.getItem(LIBRARY_FALLBACK_KEY); 
        if (lib) checklistLibrary = JSON.parse(lib); 
        return JSON.parse(localStorage.getItem(LOCAL_FALLBACK_KEY) || '[]'); 
      } catch { return []; } 
    }
    
    function saveLocalFallback() { 
      localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(projects)); 
      localStorage.setItem(LIBRARY_FALLBACK_KEY, JSON.stringify(checklistLibrary)); 
    }
    
    function hasSupabaseConfig() { 
      return typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined' && SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_URL.includes('PASTE_YOUR_'); 
    }

    function supabaseHeaders(extra = {}) { 
      return { 
        apikey: SUPABASE_ANON_KEY, 
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 
        ...extra 
      }; 
    }

    // Identical exact load function from index_2.html
    async function loadProjectsFromCloud() {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${encodeURIComponent(APP_STATE_ID)}&select=projects`,
        { headers: supabaseHeaders() }
      );
      if (!response.ok) throw new Error(`Supabase load failed: ${response.status}`);
      const data = await response.json();
      projects = Array.isArray(data?.[0]?.projects) ? data[0].projects : [];
      saveLocalFallback();
    }

    // Identical exact save function from index_2.html
    async function saveAll() {
      saveLocalFallback();
      if (!isCloudReady) return;
      setSyncStatus('Saving...', 'warning');
      
      const response = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`, {
        method: 'POST',
        headers: supabaseHeaders({
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates'
        }),
        body: JSON.stringify([{ id: APP_STATE_ID, projects, updated_at: new Date().toISOString() }])
      });
      
      if (!response.ok) { 
        console.error(await response.text());
        setSyncStatus('Save failed', 'error'); 
        return; 
      }
      setSyncStatus('Cloud Synced', 'success');
    }

    async function initSupabase() {
      if (!hasSupabaseConfig()) { 
        projects = loadLocalFallback(); 
        setSyncStatus('Missing config file', 'warning'); 
        return; 
      }
      try {
        isCloudReady = true; 
        setSyncStatus('Connecting...', 'warning');
        await loadProjectsFromCloud();
        setSyncStatus('Cloud Synced', 'success');
      } catch (error) { 
        console.error(error);
        projects = loadLocalFallback(); 
        isCloudReady = false; 
        setSyncStatus('Sync Failed', 'error'); 
      }
    }

    /* LOCAL IMAGE CACHING (INDEXEDDB FILES TAB) */
    function renderFilesTab(p, el) {
      el.innerHTML = `<div class="card"><h3>Project Files (Saved Locally)</h3><p style="font-size:13px; color:var(--muted);">Files are securely saved to your browser's hard drive to keep cloud sync incredibly fast.</p><input type="file" multiple onchange="saveFileToIDB(event, '${p.id}')" style="margin-bottom:16px;" /><div id="filesContainer" class="file-list">Loading files...</div></div>`;
      loadFilesFromIDB(p.id);
    }
    
    function loadFilesFromIDB(projectId) {
      if (!localDB) { document.getElementById('filesContainer').innerHTML = "Storage not ready."; return; }
      const tx = localDB.transaction("files", "readonly");
      const req = tx.objectStore("files").getAll();
      req.onsuccess = e => {
        const files = e.target.result.filter(f => f.projectId === projectId);
        document.getElementById('filesContainer').innerHTML = files.length ? files.map(f => `<div class="file-item"><div><strong>${esc(f.name)}</strong></div><div class="actions"><a class="btn small" href="${f.data}" download="${esc(f.name)}">Download</a><button class="btn danger small" onclick="deleteFileFromIDB('${f.id}', '${projectId}')">Del</button></div></div>`).join('') : '<div style="color:var(--muted)">No files uploaded yet.</div>';
      };
    }
    
    function saveFileToIDB(event, projectId) {
      if (!localDB) return alert("Storage not ready.");
      const tx = localDB.transaction("files", "readwrite");
      [...event.target.files].forEach(file => {
        const r = new FileReader();
        r.onload = e => { tx.objectStore("files").put({ id: uid(), projectId, name: file.name, data: e.target.result }); tx.oncomplete = () => loadFilesFromIDB(projectId); };
        r.readAsDataURL(file);
      });
    }
    function deleteFileFromIDB(fileId, projectId) { const tx = localDB.transaction("files", "readwrite"); tx.objectStore("files").delete(fileId); tx.oncomplete = () => loadFilesFromIDB(projectId); }

    /* CSV EXPORT */
    function exportToCSV() {
      const headers = ['Project ID', 'Client Name', 'Address', 'Council', 'Approval Type', 'Status', 'Total Docs', 'Missing Docs'];
      const rows = projects.map(p => {
         const missing = p.documents.filter(d=>d.required!=='No'&&!['Received','Approved'].includes(d.status)).length;
         return [p.id, `"${p.clientName}"`, `"${p.siteAddress}"`, `"${p.council}"`, p.approvalType, p.status, p.documents.length, missing].join(',');
      });
      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'project-approvals.csv'; a.click();
    }

    /* EMAIL GENERATION */
    function generateEmailChase() {
      const p = getCurrentProject();
      if(!p || !p.clientEmail) { alert('No client email address saved for this project.'); return; }
      
      const missing = p.documents.filter(d => d.required !== 'No' && !['Received','Approved'].includes(d.status));
      if(!missing.length) { alert('No documents are currently missing for this project!'); return; }
      
      const missingList = missing.map(d => '- ' + d.name).join('%0D%0A');
      const subject = `Missing Documents for ${p.siteAddress}`;
      const body = `Hi ${p.clientName},%0D%0A%0D%0AWe are currently missing the following documents for your project at ${p.siteAddress}:%0D%0A%0D%0A${missingList}%0D%0A%0D%0APlease provide these at your earliest convenience so we can proceed.%0D%0A%0D%0AThanks,`;
      
      window.location.href = `mailto:${p.clientEmail}?subject=${subject}&body=${body}`;
    }

    function updateDoc(id, field, value) { const p=getCurrentProject(); p.documents.find(x=>x.id===id)[field]=value; queueSave(); }

    function addDocumentPrompt() { const name=prompt('Doc name'); if(!name) return; const p=getCurrentProject(); p.documents.push({ id: uid(), name, required:'Yes', status:'Required', responsible:'Client' }); queueSave(); renderProjectTab(); }
    function addCouncilNote() { const p=getCurrentProject(); p.notesList.push({ id: uid(), date: todayISO(), note:'' }); queueSave(); renderProjectTab(); }
    function updateCouncilNote(id, f, v) { const p=getCurrentProject(); p.notesList.find(x=>x.id===id)[f]=v; queueSave(); }
    function removeCouncilNote(id) { const p=getCurrentProject(); p.notesList=p.notesList.filter(n=>n.id!==id); queueSave(); renderProjectTab(); }
    function addProjectNote() { const p=getCurrentProject(); p.projectNotesList.push({ id: uid(), title:'', body:'' }); queueSave(); renderProjectTab(); }
    function updateProjectNote(id, f, v) { const p=getCurrentProject(); p.projectNotesList.find(x=>x.id===id)[f]=v; queueSave(); }
    function removeProjectNote(id) { const p=getCurrentProject(); p.projectNotesList=p.projectNotesList.filter(n=>n.id!==id); queueSave(); renderProjectTab(); }
    function updateInvoiceField(field, value) { const p=getCurrentProject(); p.invoice[field]=value; queueSave(); renderProjectTab(); }
    function updateInvoiceLine(id, field, value) { const p=getCurrentProject(); p.invoice.lineItems.find(x=>x.id===id)[field]=value; queueSave(); renderProjectTab(); }
    function addInvoiceLine() { const p=getCurrentProject(); p.invoice.lineItems.push({ id: uid(), serviceName:'', price:'' }); queueSave(); renderProjectTab(); }
    function removeInvoiceLine(id) { const p=getCurrentProject(); p.invoice.lineItems = p.invoice.lineItems.filter(i => i.id !== id); queueSave(); renderProjectTab(); }

    function showChecklistLibrary() { showOnly('libraryView'); document.querySelectorAll('.nav-btn')[2].classList.add('active'); renderLibraryUI(); }
    function renderLibraryUI() { const container = document.getElementById('libraryView'); let html = `<div class="topbar"><h2>Checklist Library Editor</h2><p>Saved locally to your browser.</p></div><div class="grid two">`; for (const [type, items] of Object.entries(checklistLibrary)) { html += `<div class="card checklist-category"><h3>${type}</h3><div class="checklist-list">${items.map((item, index) => `<div class="checklist-item"><span>${esc(item)}</span><button class="btn danger small" onclick="removeLibraryItem('${type}', ${index})">✕</button></div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:12px;"><input type="text" id="addInput_${type}" placeholder="New document name..." /><button class="btn primary small" onclick="addLibraryItem('${type}')">Add</button></div></div>`; } html += `</div>`; container.innerHTML = html; }
    function addLibraryItem(type) { const val = document.getElementById(`addInput_${type}`).value.trim(); if(val) { checklistLibrary[type].push(val); saveLocalFallback(); renderLibraryUI(); } }
    function removeLibraryItem(type, index) { if(confirm('Remove this item?')) { checklistLibrary[type].splice(index, 1); saveLocalFallback(); renderLibraryUI(); } }
    
    function deleteCurrentProject() { if (!confirm('Delete project?')) return; projects = projects.filter(p => p.id !== currentProjectId); queueSave(); showDashboard(); }
    function exportData() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(projects, null, 2)], { type: 'application/json' })); a.download = 'project-tracker-backup.json'; a.click(); URL.revokeObjectURL(a.href); }
    function importData(e) { const r = new FileReader(); r.onload = ev => { try { const loaded = JSON.parse(ev.target.result); projects = Array.isArray(loaded) ? loaded : loaded.projects || []; queueSave(); showDashboard(); alert('Restored.'); } catch { alert('Error.'); } }; r.readAsText(e.target.files[0]); }
    
    async function bootstrap() { populateCouncils(); await initSupabase(); showDashboard(); }
    bootstrap();
  </script>
</body>
</html>
